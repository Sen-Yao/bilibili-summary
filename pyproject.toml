[project]
name = "bilibili-summary"
version = "0.1.0"
description = "RSS-only Bilibili summary pipeline migrated from n8n"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.2.0", "respx>=0.21.1"]

[project.scripts]
bilibili-summary = "bilibili_summary.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
